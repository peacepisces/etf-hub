<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>ETF 中心（新版預覽）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="v2.css">
<script src="theme.js"></script>
</head>
<body>
<div class="wrap">
  <header>
    <div class="bar">
      <h1><a href="#/">ETF 中心</a><span class="beta">新版預覽</span></h1>
      <div class="search">
        <input type="search" id="q" placeholder="搜尋 ETF 或個股（代號、名稱）" autocomplete="off" aria-label="搜尋 ETF 或個股">
        <div class="suggest" id="suggest" hidden></div>
      </div>
      <div class="tools-r">
        <select class="skin" id="skin" aria-label="配色"></select>
        <label class="code-pick" title="代號顏色（只存在這台裝置的瀏覽器）">代號<input type="color" id="codeColor" aria-label="代號顏色"></label>
        <button type="button" class="code-reset" id="codeReset" title="代號顏色還原成預設" aria-label="代號顏色還原" hidden>↺</button>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
  </header>
  <main id="app"><p class="lead">載入中…</p></main>
  <footer>新版預覽・<a href="../">回舊版</a></footer>
</div>
<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<script src="core.js"></script>
<script src="router.js"></script>
<script src="table.js"></script>
<script src="search.js"></script>
<script src="chart.js"></script>
<script src="donut.js"></script>
<script src="tags.js"></script>
<script src="detail.js"></script>
<script src="today.js"></script>
<script src="divpage.js"></script>
<script src="activepage.js"></script>
<script src="trackpage.js"></script>
<script src="rankpage.js"></script>
<script src="overview.js"></script>
<script src="tools.js"></script>
<script src="../live.js"></script>
<script src="pages.js"></script>
<script src="app.js"></script>
</body>
</html>
